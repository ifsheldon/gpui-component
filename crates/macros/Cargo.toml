[package]
name = "gpui-component-macros"
description = "Macros for GPUI Component."
version = "0.5.1"
license = "Apache-2.0"
publish = true
edition.workspace = true

[lib]
proc-macro = true

# eigen branch: use self-contained lints instead of workspace inheritance,
# so this crate can be compiled as a member of any workspace without
# inheriting strict host-project lint policies.
[lints.clippy]
expect_used = "allow"
unwrap_used = "allow"
todo = "warn"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

[package.metadata.cargo-machete]
ignored = ["proc-macro2", "core-text"]
